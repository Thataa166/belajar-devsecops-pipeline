
name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --error --verbose --exclude=".github"

  pylint-check:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install -r requirements.txt

      - name: Run Pylint quality gate
        run: pylint --fail-under=9.0 app.py

  deploy-to-vm:
    name: Deploy to Ubuntu VM
    needs: [sast-scan, pylint-check]
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secure-flask-app:latest .

      - name: Replace running container
        run: |
          docker stop web-flask || true
          docker rm web-flask || true
          docker run -d -p 5000:5000 --name web-flask secure-flask-app:latest

      - name: Verify deployment
        run: |
          docker ps | grep web-flask
